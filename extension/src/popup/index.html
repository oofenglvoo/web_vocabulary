<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>划词词汇助手</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 380px;
        height: 560px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        color: #1f2937;
        background: #f9fafb;
      }
      #app { width: 100%; height: 100%; display: flex; flex-direction: column; }
      header {
        padding: 10px 12px;
        border-bottom: 1px solid #e5e7eb;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      header .title { font-size: 13px; font-weight: 600; color: #2f6b5c; }
      header .status { font-size: 11px; color: #9ca3af; }
      .toolbar {
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
      }
      .toolbar label { font-size: 12px; color: #6b7280; }
      select {
        flex: 1;
        font-size: 12px;
        padding: 4px 6px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        background: #fff;
      }
      button.primary {
        font-size: 12px;
        padding: 5px 10px;
        border: none;
        border-radius: 6px;
        background: #2f6b5c;
        color: #fff;
        cursor: pointer;
      }
      button.primary:disabled { opacity: .5; cursor: default; }
      button.ghost {
        font-size: 12px;
        padding: 5px 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        background: #fff;
        color: #374151;
        cursor: pointer;
      }
      .pending {
        padding: 8px 12px;
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
        max-height: 150px;
        overflow: auto;
      }
      .pending .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        padding: 3px 0;
      }
      .pending .row .w { font-weight: 600; }
      .pending .row .t { color: #6b7280; }
      .pending .empty { font-size: 12px; color: #9ca3af; }
      iframe { flex: 1; width: 100%; border: none; background: #fff; }
      .toast {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 6px;
        background: rgba(31, 41, 55, .92);
        color: #fff;
        opacity: 0;
        transition: opacity .2s;
        pointer-events: none;
        white-space: nowrap;
      }
      .toast.show { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <span class="title">划词词汇助手</span>
        <span class="status" id="status">连接中…</span>
      </header>
      <div class="toolbar">
        <label for="category">收藏到</label>
        <select id="category"></select>
        <button class="ghost" id="refreshCategories" title="刷新分类">刷新</button>
        <button class="primary" id="collectBtn" disabled>收藏</button>
      </div>
      <div class="pending" id="pending"><div class="empty">暂无待收藏单词</div></div>
      <iframe id="appFrame" src="" title="词汇应用"></iframe>
    </div>
    <div class="toast" id="toast"></div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
